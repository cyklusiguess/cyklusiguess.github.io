<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;

            background: linear-gradient(
                -45deg,
                #020617,
                #0f172a,
                #0b2447,
                #1e3a8a,
                #0b2447
            );
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;

            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 600;
            line-height: 1.4;
            text-shadow: 0 0 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            i got a domain,<br>
            i will change this completely once i set up everything Lmao
        </h1>
    </div>
</body>
</html>
